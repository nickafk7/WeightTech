<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#FF6B35">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icons/icon-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512x512.png">
<link rel="apple-touch-icon" href="/icons/icon-192x192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Disciplina</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--s1:#121212;--s2:#181818;--line:#272727;--tx:#ededed;--mut:#8a8a8a;--ac:#e4e4e4;--l1:#2a2a2a;--l2:#4a4a4a;--l3:#8a8a8a;--l4:#e4e4e4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Instrument Sans',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:disabled{opacity:.5;cursor:wait}
input{font:inherit;color:var(--tx);background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:12px 13px;width:100%;min-width:0}
input:focus{outline:none;border-color:var(--l3)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.btn{background:var(--ac);color:#0a0a0a;font-weight:600;padding:12px 18px;border-radius:10px;width:100%}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
.btn.sm{width:auto;padding:9px 14px}
.hide{display:none!important}
#auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.box{width:100%;max-width:380px}
.mark{width:52px;height:52px;border-radius:14px;background:var(--s2);border:1px solid var(--line);display:grid;place-items:center;font-size:28px;filter:grayscale(1);margin-bottom:22px}
.box h1{font-size:28px;font-weight:800;margin-bottom:6px}
.box p.s{color:var(--mut);margin:0 0 22px}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.f label{font-size:13px;color:var(--mut)}
.err{color:#d0d0d0;font-size:13px;min-height:18px;margin:-4px 0 10px}
.lnk{color:var(--mut);font-size:13px;text-decoration:underline;margin:-6px 0 14px;display:inline-block}
.sep{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12px;margin:14px 0}
.sep:before,.sep:after{content:"";flex:1;height:1px;background:var(--line)}
.alt{text-align:center;color:var(--mut);font-size:14px;margin-top:18px}
.alt button{color:var(--tx);font-weight:600;text-decoration:underline}
.logo{font-size:22px;filter:grayscale(1)}
.av{width:34px;height:34px;border-radius:50%;background:var(--l2);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
h2{font-size:24px;font-weight:800;margin-bottom:4px}
.sub{color:var(--mut);margin:0 0 20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.st{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:14px}
.st b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:28px;font-weight:800}
.st span{color:var(--mut);font-size:12.5px}
.add{display:flex;gap:8px;margin-bottom:12px}
.add input[type=time]{width:112px;flex:none}
.add .btn{width:auto}
.notif{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:16px;font-size:14px;color:var(--mut)}
.notif button{color:var(--tx);font-weight:600;padding:6px 8px}
.task{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.top{display:flex;align-items:center;gap:12px}
.flame{width:50px;height:50px;flex:none;display:grid;place-items:center;font-size:30px;border-radius:50%;background:var(--bg);border:1px solid var(--line);filter:grayscale(1) brightness(.45);transition:.3s}
.flame.on{filter:grayscale(1) brightness(1.5);background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%);border-color:var(--l3)}
.info{flex:1;min-width:0}
.name{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:17px;overflow-wrap:anywhere}
.meta{color:var(--mut);font-size:13px;margin-top:2px}
.meta b{color:var(--tx)}
.done{padding:10px 14px;border-radius:10px;border:1.5px solid var(--l3);font-weight:600;flex:none}
.done.ok{background:var(--ac);border-color:var(--ac);color:#0a0a0a}
.week{display:flex;gap:6px;margin-top:12px}
.d{flex:1;text-align:center;font-size:11px;color:var(--mut)}
.d i{display:block;height:7px;border-radius:4px;background:var(--l1);margin-bottom:4px}
.d.h i{background:var(--l4)}
.row2{display:flex;justify-content:space-between;margin-top:10px;font-size:13px;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:34px 12px;border:1px dashed var(--line);border-radius:16px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
.card h3{font-size:16px;margin-bottom:12px}
.heat{display:grid;grid-template-rows:repeat(7,16px);grid-auto-flow:column;gap:4px;overflow-x:auto;padding-bottom:4px}
.c{width:16px;height:16px;border-radius:4px;background:var(--l1)}
.c[data-l="1"]{background:var(--l2)}.c[data-l="2"]{background:var(--l3)}.c[data-l="3"]{background:#bcbcbc}.c[data-l="4"]{background:var(--l4)}
.leg{display:flex;align-items:center;gap:5px;color:var(--mut);font-size:12px;margin-top:10px}
.leg .c{width:12px;height:12px}
.log{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.log:first-of-type{border-top:0}
.log small{color:var(--mut)}
.log span:last-child{color:var(--mut);font-size:13px;text-align:right}
.prof{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.prof .av{width:56px;height:56px;font-size:22px}
.acts{display:flex;flex-direction:column;gap:10px;max-width:320px}

.chips{display:flex;gap:6px;margin:0 0 8px}
.chip{flex:1;padding:9px 0;border-radius:9px;border:1px solid var(--line);color:var(--mut);font-size:13px;font-weight:600}
.chip.on{background:var(--ac);color:#0a0a0a;border-color:var(--ac)}
.presets{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.pre{padding:7px 12px;border-radius:999px;border:1px solid var(--line);color:var(--mut);font-size:13px}
.pre.on{border-color:var(--ac);color:var(--tx)}
.d.x{opacity:.3}
.task.dim{opacity:.6}
.off{color:var(--mut);font-size:13px;flex:none}
.a2{display:flex;gap:16px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:16px;z-index:20}
.mbox{width:100%;max-width:420px;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:18px}
.mbox h3{margin-bottom:14px}
.mrow{display:flex;gap:8px;margin-top:6px}
.mrow .btn{flex:1}

.dia{margin-bottom:18px}
.dh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.dh b{font-family:'Bricolage Grotesque',sans-serif;font-size:16px}
.dh small{color:var(--mut);font-size:12.5px}
.it{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--s1);margin-bottom:6px}
.it .m{width:20px;text-align:center;flex:none}
.it.ok .m{color:var(--ac);font-weight:700}
.it.no,.it.pe{color:var(--mut)}
.it .hr{margin-left:auto;color:var(--mut);font-size:13px;flex:none}
.it .nm{overflow-wrap:anywhere}
.seg{display:flex;gap:8px;margin-bottom:16px}

.dia{scroll-margin-top:70px}
.presets .dt{width:auto;padding:6px 12px;border-radius:999px;font-size:13px;color-scheme:dark;color:var(--mut)}
.presets .dt.on{border-color:var(--ac);color:var(--tx)}

html{-webkit-text-size-adjust:100%}
button{touch-action:manipulation}
#auth{min-height:100vh;min-height:100dvh;padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom))}

/* ---- base: celular ---- */
#side{display:contents}
header{position:sticky;top:0;z-index:5;background:rgba(10,10,10,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar{max-width:880px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:14px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;gap:2px;background:rgba(10,10,10,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px;border-radius:10px;color:var(--mut);font-size:11.5px;font-weight:500}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--tx);background:var(--s2)}
main{max-width:880px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right)) 110px max(16px,env(safe-area-inset-left))}
#view[data-aba="tempo"],#view[data-aba="perfil"]{max-width:720px}
.tgrid{display:grid;gap:10px}
.tgrid .task{margin-bottom:0}
.tgrid .empty{grid-column:1/-1}
@media (max-width:480px){
  .add{flex-wrap:wrap}
  .add #nome{flex:1 1 100%}
  .add input[type=time]{flex:1;width:auto}
  .add .btn{flex:1}
  .chip{padding:10px 0}
}
@media (max-width:380px){
  .st{padding:11px}.st b{font-size:22px}.st span{font-size:11.5px}
  .flame{width:42px;height:42px;font-size:24px}
  .top{gap:9px}.done{padding:9px 11px}
}
@media (max-width:639px){
  #modal{place-items:end center;padding:0}
  .mbox{max-width:none;border-radius:18px 18px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
}

/* ---- tablet ---- */
@media (min-width:640px){
  nav{position:static;max-width:880px;margin:0 auto;background:none;backdrop-filter:none;border:0;padding:10px 16px 0;gap:6px}
  nav button{flex:0 0 auto;flex-direction:row;gap:8px;padding:9px 14px;font-size:14px}
  nav button svg{width:18px;height:18px}
  main{padding:22px 24px 60px}
  .tgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
  .heat{grid-template-rows:repeat(7,20px)}
  .c{width:20px;height:20px}
  .card{padding:20px}
  h2{font-size:28px}
}

/* ---- desktop ---- */
@media (min-width:1024px){
  #app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
  #side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--s1)}
  header{position:static;background:none;backdrop-filter:none;border:0}
  .bar{padding:22px 20px 14px}
  nav{flex-direction:column;max-width:none;margin:0;width:100%;padding:8px 12px;gap:4px}
  nav button{width:100%;padding:11px 14px;text-align:left}
  main{max-width:1040px;width:100%;padding:36px 40px 60px}
  #view[data-aba="tempo"],#view[data-aba="perfil"]{max-width:720px}
  .stats{gap:14px}.st{padding:18px}.st b{font-size:32px}
}
@media (min-width:1500px){
  .tgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  main{max-width:1280px}
}

.done.ok:disabled{opacity:1;cursor:default}

.done.lock{opacity:.65;border-style:dashed;cursor:not-allowed;white-space:nowrap}

.av{overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.prof2{display:flex;gap:16px;align-items:center}
.bigav{width:88px;height:88px;border-radius:50%;background:var(--l2);display:grid;place-items:center;font-size:34px;font-weight:700;overflow:hidden;flex:none}
.bigav img{width:100%;height:100%;object-fit:cover}
.pinfo{min-width:0;flex:1}
.pinfo h3{overflow-wrap:anywhere}
.bio{margin:8px 0 0;font-size:14px}
.pbtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.msg{min-height:20px;font-size:14px;margin:0 0 12px;color:var(--mut)}
.msg.ok{color:var(--tx)}
.note{font-size:13px;color:var(--mut);margin:0 0 12px}
@media (max-width:380px){.bigav{width:68px;height:68px;font-size:26px}}

select{font:inherit;color:var(--tx);background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color-scheme:dark;max-width:100%}
#lgP{width:100%}
.lang{margin-top:22px;text-align:center}

html[dir=rtl] input[type=email],html[dir=rtl] input[type=password]{direction:ltr;text-align:right}
html[dir=rtl] .log span:last-child{text-align:left}
html[dir=rtl] .it .hr{margin-left:0;margin-right:auto}
html[lang=ar] .chip,html[lang=hi] .chip{font-size:11px;padding-left:0;padding-right:0}
@media (min-width:1024px){html[dir=rtl] #side{border-right:0;border-left:1px solid var(--line)}}

.aviso{display:flex;gap:12px;align-items:flex-start;background:var(--s1);border:1px solid var(--l3);border-radius:16px;padding:14px 16px;margin-bottom:18px}
.aviso .ai{font-size:20px;line-height:1.2;flex:none;color:var(--ac)}
.aviso b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:16px;margin-bottom:3px}
.aviso p{margin:0;color:var(--mut);font-size:14px;line-height:1.45}
.aviso .btn{margin-top:12px}
</style>
<script>
if('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(e => console.log('SW registration failed:', e));
}
</script>
</head>
<body>

<section id="auth">
  <div class="box">
    <div class="mark">🔥</div>
    <h1 id="aT">Entrar</h1>
    <p class="s" id="aS">Acesse sua conta para continuar sua sequência.</p>
    <div class="f hide" id="gN"><label for="nm" data-i="Nome">Nome</label><input id="nm" autocomplete="name"></div>
    <div class="f"><label for="em" data-i="E-mail">E-mail</label><input id="em" type="email" autocomplete="email"></div>
    <div class="f"><label for="pw" data-i="Senha">Senha</label><input id="pw" type="password" autocomplete="current-password"></div>
    <button class="lnk" id="aR" data-i="Esqueci a senha">Esqueci a senha</button>
    <div class="err" id="aE"></div>
    <button class="btn" id="aB">Entrar</button>
    <div class="alt"><span id="aA">Ainda não tem conta?</span> <button id="aX">Criar conta</button></div>
    <div class="lang"><select id="lgA" aria-label="Idioma / Language"></select></div>
  </div>
</section>

<div id="app" class="hide">
  <aside id="side">
    <header><div class="bar"><span class="logo">🔥</span><div class="av" id="avt"></div></div></header>
    <nav id="nav">
      <button data-v="hoje" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg><span data-i="Hoje">Hoje</span></button>
      <button data-v="hist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span data-i="Histórico">Histórico</span></button>
      <button data-v="tempo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span data-i="Diário">Diário</span></button>
      <button data-v="perfil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 14.5-4 16 0"/></svg><span data-i="Perfil">Perfil</span></button>
    </nav>
  </aside>
  <main id="view"></main>
</div>

<div id="modal" class="hide"><div class="mbox" role="dialog" aria-modal="true" aria-label="Editar tarefa">
  <h3 data-i="Editar tarefa">Editar tarefa</h3>
  <div class="f"><label for="eN" data-i="Nome">Nome</label><input id="eN" maxlength="60"></div>
  <div class="f"><label for="eH" data-i="Horário do lembrete">Horário do lembrete</label><input id="eH" type="time"></div>
  <div class="f"><label data-i="Dias">Dias</label><div id="chipsEdit"></div></div>
  <div class="err" id="eE"></div>
  <div class="mrow"><button class="btn ghost" data-a="cancel" data-i="Cancelar">Cancelar</button><button class="btn" data-a="save" data-i="Salvar">Salvar</button></div>
</div></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

if(typeof firebase==='undefined'){
  document.getElementById('aE').textContent=(navigator.language||'').slice(0,2)==='pt'?'Não foi possível carregar o Firebase. Verifique sua conexão e recarregue a página.':'Could not load Firebase. Check your connection and reload the page.';

}

  storageBucket: "sistema-pesagem-64115.firebasestorage.app",

  appId: "1:81841243626:web:5e8aff73a25f5770885e93",
  measurementId: "G-QD5RH2733X"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hoje=()=>iso(new Date());
const addD=(s,n)=>{const [y,m,d]=s.split('-').map(Number);return iso(new Date(y,m-1,d+n))};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const detectar=()=>{const n=(navigator.language||'pt').slice(0,2).toLowerCase();return LNOME[n]?n:'en'};
let LANG=(()=>{try{const x=localStorage.getItem('disc_lang');if(x&&LNOME[x])return x}catch(e){}return detectar()})();
let NOMES=[],NF=[],LETRAS=[];
function tr(k,v){
  let x=(LANG==='pt'?k:(DICT[LANG]&&DICT[LANG][k]))||k;
  if(v)for(const c in v)x=x.split('{'+c+'}').join(v[c]);
  return x;
}
const fmt=s=>new Date(s+'T12:00:00').toLocaleDateString(LOC[LANG],{day:'2-digit',month:'2-digit',year:'numeric'});
const fmtc=s=>new Date(s+'T12:00:00').toLocaleDateString(LOC[LANG],{day:'2-digit',month:'2-digit'});
function nomesDias(){
  const cap=x=>x.charAt(0).toUpperCase()+x.slice(1);NOMES=[];NF=[];LETRAS=[];
  for(let i=0;i<7;i++){const d=new Date(2023,0,1+i);
    NOMES.push(cap(d.toLocaleDateString(LOC[LANG],{weekday:'short'}).replace('.','')));
    NF.push(cap(d.toLocaleDateString(LOC[LANG],{weekday:'long'})));
    LETRAS.push(d.toLocaleDateString(LOC[LANG],{weekday:'narrow'}).toUpperCase())}
}
const optsIdioma=()=>Object.entries(LNOME).map(([k,n])=>`<option value="${k}" ${k===LANG?'selected':''}>${n}</option>`).join('');
function aplicarI18n(){
  document.documentElement.lang=LOC[LANG];
  document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
  nomesDias();
  document.querySelectorAll('[data-i]').forEach(el=>{el.textContent=tr(el.dataset.i)});
  const dlg=document.querySelector('#modal .mbox');if(dlg)dlg.setAttribute('aria-label',tr('Editar tarefa'));
  const a=$('lgA');if(a)a.innerHTML=optsIdioma();
  setModo(modo);
  if(user)render();
}
function trocarIdioma(l){
  if(!LNOME[l])return;
  LANG=l;try{localStorage.setItem('disc_lang',l)}catch(e){}
  aplicarI18n();
  if(user){perfil.lang=l;db.collection('users').doc(user.uid).set({lang:l},{merge:true}).catch(console.error)}
}
document.addEventListener('change',e=>{if(e.target.id==='lgA'||e.target.id==='lgP')trocarIdioma(e.target.value)});

const erro=e=>{if(e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request')return;$('aE').textContent=MSGK[e.code]?tr(MSGK[e.code]):tr('Algo deu errado ({c}).',{c:e.code||e.message})};

async function enviar(){
  const email=$('em').value.trim(), pw=$('pw').value, nome=$('nm').value.trim();
  $('aE').textContent='';
  if(!/^\S+@\S+\.\S+$/.test(email))return $('aE').textContent=tr('Digite um e-mail válido.');
  if(modo==='reg'&&!nome)return $('aE').textContent=tr('Digite seu nome.');
  if(!pw)return $('aE').textContent=tr('Digite sua senha.');
  $('aB').disabled=true;
  try{
    if(modo==='reg'){
      const c=await auth.createUserWithEmailAndPassword(email,pw);
      await c.user.updateProfile({displayName:nome});
      await db.collection('users').doc(c.user.uid).set({nome,email,criada:hoje()},{merge:true});
      user=auth.currentUser;start();
    }else await auth.signInWithEmailAndPassword(email,pw);
  }catch(e){erro(e)}
  $('aB').disabled=false;
}

/* ---------- lógica ---------- */
const TODOS=[0,1,2,3,4,5,6];
const S={novo:{sem:[...TODOS],data:null},edit:null};
let janela=30;
const porHora=(a,b)=>(a.hora||'').localeCompare(b.hora||'');
const hhmm=()=>{const n=new Date();return pad(n.getHours())+':'+pad(n.getMinutes())};
const FIM='9999-99-99';
function proxima(t,h){if(t.data)return t.data>h?t.data:FIM;for(let i=1;i<=7;i++){const d=addD(h,i);if(agendada(t,d))return d}return FIM}
function ordenadas(){const h=hoje();const k=t=>agendada(t,h)?'0'+(t.hora||''):'1'+proxima(t,h)+(t.hora||'');return [...tarefas].sort((a,b)=>k(a).localeCompare(k(b)))}
const wd=d=>new Date(d+'T12:00:00').getDay();
const agendada=(t,d)=>t.data?t.data===d:(t.sem||TODOS).includes(wd(d));
function rotulo(t){
  if(t.data)return t.data===hoje()?tr('Só hoje'):tr('Só em {d}',{d:fmtc(t.data)});
  const s=[...(t.sem||TODOS)].sort();
  if(s.length===7)return tr('Todos os dias');
  if(s.join()==='1,2,3,4,5')return tr('Seg–Sex');
  if(s.join()==='0,6')return tr('Fins de semana');
  return s.map(i=>NOMES[i]).join(', ');
}
function streak(t){
  if(t.data)return t.dias.length?1:0;
  let d=hoje(),n=0;
  if(agendada(t,d)&&!t.dias.includes(d))d=addD(d,-1);
  for(let i=0;i<800;i++){
    if(agendada(t,d)){if(t.dias.includes(d))n++;else break}
    d=addD(d,-1);
  }
  return n;
}
function recorde(t){
  if(t.data)return t.dias.length?1:0;
  if(!t.dias.length)return 0;
  const end=hoje();let d=[...t.dias].sort()[0],c=0,b=0;
  for(let i=0;i<1500&&d<=end;i++){
    if(agendada(t,d)){if(t.dias.includes(d)){c++;b=Math.max(b,c)}else c=0}
    d=addD(d,1);
  }
  return b;
}
function seletor(st){
  const chips=NOMES.map((n,i)=>`<button type="button" class="chip ${!st.data&&st.sem.includes(i)?'on':''}" data-a="dia" data-w="${i}">${n}</button>`).join('');
  const sel=st.data?(st.data===hoje()?'hoje':'data'):st.sem.length===7?'todos':st.sem.join()==='1,2,3,4,5'?'util':'';
  const pre=[['todos','Todos os dias'],['util','Seg–Sex'],['hoje','Só hoje']].map(([p,l])=>`<button type="button" class="pre ${sel===p?'on':''}" data-a="preset" data-p="${p}">${tr(l)}</button>`).join('');
  return `<div class="chips">${chips}</div><div class="presets">${pre}<input type="date" class="dt ${sel==='data'?'on':''}" data-a="data" value="${st.data||''}" aria-label="${tr('Escolher uma data')}"></div>`;
}
function pintar(k){const el=$(k==='edit'?'chipsEdit':'chipsNovo');if(el)el.innerHTML=seletor(S[k])}
function pick(b){
  const k=b.closest('#modal')?'edit':'novo',st=S[k];
  if(b.dataset.a==='dia'){
    const w=+b.dataset.w;
    if(st.data){st.data=null;st.sem=[w]}
    else st.sem=st.sem.includes(w)?st.sem.filter(x=>x!==w):[...st.sem,w].sort();
  }else{
    const p=b.dataset.p;
    if(p==='todos'){st.data=null;st.sem=[...TODOS]}
    else if(p==='util'){st.data=null;st.sem=[1,2,3,4,5]}
    else st.data=hoje();
  }
  pintar(k);
}
document.addEventListener('change',e=>{const el=e.target;if(!el.matches||!el.matches('input[data-a="data"]'))return;const k=el.closest('#modal')?'edit':'novo';S[k].data=el.value||null;pintar(k)});
function abrirEdit(t){
  S.edit={id:t.id,sem:[...(t.sem||TODOS)],data:t.data||null};
  $('eN').value=t.nome;$('eH').value=t.hora;$('eE').textContent='';
  pintar('edit');$('modal').classList.remove('hide');$('eN').focus();
}
$('modal').addEventListener('click',async e=>{
  const b=e.target.closest('button[data-a]');
  if(e.target.id==='modal'||(b&&b.dataset.a==='cancel')){$('modal').classList.add('hide');return}
  if(!b)return;
  if(b.dataset.a==='dia'||b.dataset.a==='preset')return pick(b);
  if(b.dataset.a==='save'){
    const st=S.edit,nome=$('eN').value.trim();
    if(!nome)return $('eE').textContent=tr('Digite o nome da tarefa.');
    if(!st.data&&!st.sem.length)return $('eE').textContent=tr('Escolha pelo menos um dia.');
    b.disabled=true;
    try{await habits().doc(st.id).update({nome,hora:$('eH').value||'20:00',sem:st.sem,data:st.data||null});$('modal').classList.add('hide')}
    catch(err){console.error(err);$('eE').textContent=tr('Não foi possível salvar. Tente novamente.')}
    b.disabled=false;
  }
});

function render(){
  if(!user)return;

    negado:['Notificações bloqueadas. Libere nas configurações do site.',''],
    nao:[IOS&&!STANDALONE?'No iPhone: toque em Compartilhar → Adicionar à Tela de Início e abra pelo ícone.':'Este navegador não suporta notificações em segundo plano.',''],
    erro:['Não foi possível ativar as notificações. Tente de novo.',btn],
    pendente:['Ative para ser avisado mesmo com o app fechado.',btn]
  }[pushEstado]||['',''];
  el.innerHTML=`<span>${m[0]?tr(m[0]):''}</span>${m[1]}`;
  const b=$('perm');if(b)b.onclick=async()=>{b.disabled=true;pushEstado=await ativarPush(true);renderNotif()};
}
function checar(){
  if(!user)return;
  const now=new Date(),h=`${pad(now.getHours())}:${pad(now.getMinutes())}`;
  tarefas.forEach(t=>{
    if(t.dias.includes(hoje())||!agendada(t,hoje())||h<t.hora)return;
    if(avisos.has(t.id)&&Date.now()-avisos.get(t.id)<30*60000)return;
    avisos.set(t.id,Date.now());
    try{if('Notification' in window&&Notification.permission==='granted')new Notification('Disciplina',{tag:'disc-'+t.id,icon:'icon-192.png',body:tr('Você ainda não fez "{n}". Sua sequência de {s} dias está em risco.',{n:t.nome,s:streak(t)})})}catch(e){}
  });
}
setInterval(checar,30000);
setInterval(()=>{if(!user||aba!=='hoje')return;const n=hhmm();if([...document.querySelectorAll('.done.lock')].some(b=>b.dataset.h<=n))render()},15000);
aplicarI18n();
</script>
